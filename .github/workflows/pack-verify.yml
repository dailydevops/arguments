name: Package Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify analyzer delivery in packed NuGet package
    runs-on: windows-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: |
          10.0.x

    - name: Verify packed package delivers a working analyzer
      shell: pwsh
      run: ./scripts/verify-package.ps1
